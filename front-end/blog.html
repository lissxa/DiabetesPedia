<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiabetesPedia - Blog</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back,arrow_forward,star,star_half,stars_2"
    />

    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/blog.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="./app.js"></script>
  </head>

  <body class="bg-lightgrey03" id="blog-page">
    <header class="bg-image-settings position-relative">
      <div
        class="linear-gradient-bg blue-gradient-bg position-absolute top-0 start-0 w-100 h-100 z-0"
      ></div>
      <main-navbar
        class="navbar navbar-expand-lg position-relative z-3 py-4 bg-white"
      ></main-navbar>
      <div
        class="jumbotron padding-common py-5 w-100 position-relative z-1 jumbotron-landingpage"
      >
        <div
          class="jumbotron-text-action w-100 h-100 d-flex flex-column align-items-center justify-content-center gap-2 text-center"
        >
          <h6>
            <span class="badge text-bg-warning fs-6">Blogs</span>
          </h6>
          <h1 class="fw-bold text-white">Your Health, Your Knowledge Hub</h1>
          <p class="fs-5 fw-semibold text-white">
            Explore topics that matter most to your wellness
          </p>
        </div>
      </div>
      <search-blog></search-blog>
    </header>

    <main id="main-content" class="d-flex flex-column gap-5 pt-5">
      <blog-list-detail></blog-list-detail>
      <button class="btn btn-primary btn-lg mx-auto mb-5">
        Load More Blogs
      </button>
    </main>

    <div class="padding-common">
      <div class="horizontal-divider bg-body-secondary"></div>
    </div>

    <footer
      class="py-5 d-flex flex-column gap-4 padding-common position-relative"
    >
      <img
        src="/src/public/images/logo/small logo.png"
        id="footer-logo"
        alt=""
      />
      <my-footer class="container-fluid"></my-footer>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
      integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
