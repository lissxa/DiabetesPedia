<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diabetes Risk Prediction Result</title>
    <link rel="shortcut icon" href="/logo.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/dashboard.css" />
    <link rel="stylesheet" href="src/styles/prediction-result.css" />
    <link rel="stylesheet" href="src/styles/auth.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back,arrow_forward,check,check_circle,close,error,info,notifications,star,star_half,stars_2,warning"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <header class="bg-image-settings position-relative">
      <div
        class="linear-gradient-bg blue-gradient-bg position-absolute top-0 start-0 w-100 h-100 z-0"
      ></div>
      <main-navbar
        class="navbar navbar-expand-lg position-relative z-3 py-4 bg-white"
      ></main-navbar>
      <div class="jumbotron padding-common py-5 w-100 position-relative z-1">
        <div
          class="jumbotron-text-action w-100 h-100 d-flex flex-column align-items-center gap-2 text-center"
        >
          <h1 class="fw-bold text-white">Diabetes Risk Prediction Result</h1>
          <p class="fs-5 fw-semibold text-white">
            Based on the information provided and our predictive model, this is
            the comprehensive result of your prediction
          </p>
        </div>
      </div>
    </header>
    <div class="main-container">
      <div id="prediction-result-container" class="container mt-5"></div>

      <div class="container text-center mt-4 mb-5"></div>
    </div>

    <signin-form
      class="modal fade"
      id="signInModal"
      tabindex="-1"
      aria-labelledby="signInModalLabel"
      aria-hidden="true"
    ></signin-form>

    <signup-form
      class="modal fade"
      id="signUpModal"
      tabindex="-1"
      aria-labelledby="signUpModalLabel"
      aria-hidden="true"
    >
    </signup-form>

    <footer
      class="py-5 d-flex flex-column gap-4 padding-common position-relative"
    >
      <img
        src="/src/public/images/logo/logo_landscape_text.png"
        id="footer-logo"
        alt=""
      />
      <my-footer class="container-fluid"></my-footer>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
      integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./app.js"></script>

    <script
      type="module"
      src="/src/scripts/components/log-new-entry/prediction-result.js"
    ></script>
  </body>
</html>
